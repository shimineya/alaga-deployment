name: alaga
description: A patient care mobile application

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1   
  local_auth: ^2.1.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.2
  http_parser: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/alagahead.png"
